[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rhythia-map-studio"
dynamic = ["version"]
description = "Local desktop map authoring for Rhythia Steam"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "soundfile>=0.13,<1", "PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "pyinstaller>=6"]

[project.scripts]
rhythia-map-studio = "rhythia_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "rhythia_studio.__version__"}

[tool.setuptools.package-data]
rhythia_studio = ["ui/assets/*.svg", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["Settings"]

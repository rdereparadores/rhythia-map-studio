name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag, version and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release_version.py

  app:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-release-app.txt
      - name: Install pinned release environment
        run: |
          python -m pip install -r requirements-release-app.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Check style and tests on the release commit
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check src tests tools run_studio.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check src tests tools run_studio.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
      - name: Compile and verify application
        run: |
          ./build.ps1 -Python (Get-Command python).Source
          python tools/check_release_package.py app dist/bin/RhythiaMapStudio/RhythiaMapStudio.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/collect_licenses.py dist/third-party-licenses/app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze --all | Set-Content dist/build-environment-app.txt
          python tools/package_release.py app
      - uses: actions/upload-artifact@v4
        with:
          name: release-app
          path: release-assets/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  separator:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-release-separator.txt
      - name: Install pinned CPU separator environment
        run: |
          python -m pip install setuptools==78.1.0 wheel==0.48.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps torch==2.5.1+cpu torchaudio==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation -r requirements-release-separator.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Compile separator and verify real CPU inference
        run: |
          ./build.ps1 -SeparatorOnly -SeparatorPython (Get-Command python).Source
          python tools/check_release_package.py separator dist/separation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/collect_licenses.py dist/third-party-licenses/separator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze --all | Set-Content dist/build-environment-separator.txt
          python tools/package_release.py separator
      - uses: actions/upload-artifact@v4
        with:
          name: release-separator
          path: release-assets/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [validate, app, separator]
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete asset set and calculate checksums
        run: python tools/package_release.py checksums
      - name: Prepare or publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_AUTO_PUBLISH: ${{ vars.RELEASE_AUTO_PUBLISH }}
        run: python tools/publish_release.py
